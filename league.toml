# League configuration. No private data here: this file is committed.
# The league id, team id and roster live in gitignored files or the environment.

teams = 10
season = 2026

# Yahoo's default FAAB budget. Confirm against the league settings page once the
# Yahoo API approval arrives, then correct this if it differs.
faab_budget = 100

timezone = "America/New_York"

# Values that identify you belong in `league.local.toml`, which is gitignored and overrides
# any key here. Two of them:
#
#   yahoo_league_id = 12345          the number at the end of your league's Yahoo URL,
#                                    needed only when your account has several leagues
#   own_team = "Your Team Name"      used only with pasted budgets; the API knows your team
#   keepers = ["Player Name"]        never suggested as a drop; Yahoo's keeper flag also
#                                    protects them, and this covers the pasted fallback
#
# Positions a waiver claim may be for. Narrow it if you never want a claim at one, for
# example a quarterback when you already roster two starters.
claim_positions = ["QB", "RB", "WR", "TE", "K"]

# Bench spots. IR slots are separate and are not counted here.
bench = 5

# Starting slots, read off the Yahoo roster page: 10 starters and 5 bench.
# FLEX is Yahoo's W/R/T.
[slots]
QB = 1
RB = 2
WR = 3
TE = 1
FLEX = 1
K = 1
DEF = 1

# Scoring, used to project points. These defaults reproduce nflverse's
# fantasy_points_ppr exactly, verified against a real week 1 line. Change `reception` to
# 0.5 for half PPR or 0 for standard: it is the one term that cannot be derived from the
# published totals, and it moves every receiver and back.
[scoring]
pass_yards = 0.04
pass_td = 4.0
interception = -2.0
rush_yards = 0.1
rush_td = 6.0
reception = 1.0
rec_yards = 0.1
rec_td = 6.0
fumble_lost = -2.0
